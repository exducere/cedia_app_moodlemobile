<ion-header>
    <ion-toolbar>
        <div class="cedia-header-logo">
            <img src="assets/img/cedia/site/cedia-logo.png"
                 class="cedia-logo"
                 [alt]="'core.login.logoof' | translate: { $a: appName }">
        </div>
    </ion-toolbar>
</ion-header>

<ion-content class="cedia-login-content">
    <div class="list-item-limited-width cedia-page-wrapper">

        <!-- Hero Banner — full width con texto overlay -->
        <div class="cedia-hero-banner">
            <img src="assets/img/cedia/site/6178.jpg"
                 class="cedia-hero-image"
                 [alt]="'core.login.logoof' | translate: { $a: appName }">
            <div class="cedia-hero-overlay">
                <h2 class="cedia-hero-title">CEDIA EVOLUCIONA</h2>
                <p class="cedia-hero-subtitle">CON EL CONOCIMIENTO</p>
            </div>
        </div>

        <!-- Contenido principal -->
        <div class="cedia-scroll-content">

            <!-- Título sección -->
            <div class="cedia-title-section">
                <h1 class="cedia-main-title">
                    Selecciona tu <span class="cedia-title-highlight">Aula Virtual</span>
                </h1>
            </div>

            <!-- Lista de Campus -->
            <div class="cedia-campus-list">
                @if (loadingAulas) {
                    <div class="cedia-campus-loading">
                        <ion-spinner name="crescent"></ion-spinner>
                    </div>
                } @else {
                    @if (cediaAulas[0]) {
                        <div class="cedia-campus-item" (click)="connectToCampus(cediaAulas[0].url)">

                            <div class="cedia-campus-info">
                                <img src="assets/img/cedia/site/cedia-tmo.png"
                                     class="cedia-campus-brand-logo"
                                     alt="CEDIA TMO" />
                            </div>

                        </div>
                    }
                    @if (cediaAulas[1]) {
                        <div class="cedia-campus-item" (click)="connectToCampus(cediaAulas[1].url)">

                            <div class="cedia-campus-info">
                                <img src="assets/img/cedia/site/cedia-tmo-track.png"
                                     class="cedia-campus-brand-logo"
                                     alt="CEDIA TMO Track" />
                            </div>

                        </div>
                    }
                }
            </div>

            <!-- Info card -->
            <div class="cedia-info-card">
                <div class="cedia-info-icon">
                    <ion-icon name="cedia-information" />
                </div>
                <div class="cedia-info-content">
                    <h4>¿Necesitas ayuda para ingresar?</h4>
                    <p>Usa las credenciales institucionales de tu universidad u organización.</p>
                </div>
            </div>

        </div>

        <!-- Barra inferior -->
        <div class="cedia-bottom-bar">
            <div class="cedia-quick-action" (click)="showHelp()">
                <div class="cedia-quick-action-circle">
                    <ion-icon name="cedia-question" />
                </div>
                <span>Ayuda</span>
            </div>
            <div class="cedia-quick-action" (click)="openSettings()">
                <div class="cedia-quick-action-circle">
                    <ion-icon name="cedia-gear-complex" />
                </div>
                <span>Ajustes</span>
            </div>
            <div class="cedia-quick-action" (click)="openContact()">
                <div class="cedia-quick-action-circle">
                    <ion-icon name="cedia-message" />
                </div>
                <span>Contacto</span>
            </div>
        </div>

        <!-- Versión -->
        <div class="cedia-app-version">
            <span>v{{ appVersion }}</span>
        </div>

    </div>
</ion-content>
