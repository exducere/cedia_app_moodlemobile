<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button [text]="'core.back' | translate" />
        </ion-buttons>
        <ion-title>
            <h1>{{ 'core.grades.grades' | translate }}</h1>
        </ion-title>
    </ion-toolbar>
</ion-header>
<ion-content>
    <core-split-view>
        <ion-refresher slot="fixed" [disabled]="!courses.loaded" (ionRefresh)="refreshCourses($event.target)">
            <ion-refresher-content pullingText="{{ 'core.pulltorefresh' | translate }}" />
        </ion-refresher>
        <core-loading [hideUntil]="courses.loaded" placeholderType="column" placeholderHeight="88px">
            @if (courses.empty) {
                <core-empty-box icon="cedia-analytics" [message]="'core.grades.nogradesreturned' | translate" />
            } @else {
                <div class="grades-courses-list">
                    @for (course of courses.items; track course.courseid) {
                        <div class="grades-course-card"
                            [attr.aria-label]="course.courseFullName"
                            [attr.aria-current]="courses.getItemAriaCurrent(course)"
                            [attr.data-course-id]="course.courseid"
                            (click)="courses.select(course)">

                            <div class="grades-course-icon">
                                <ion-icon name="fas-book-open" />
                            </div>

                            <div class="grades-course-info">
                                <p class="grades-course-name">
                                    <core-format-text [text]="course.courseFullName" [contextInstanceId]="course.courseid"
                                        contextLevel="course" />
                                </p>
                                <p class="grades-course-label">{{ 'core.grades.grades' | translate }}</p>
                            </div>

                            <div class="grades-course-grade">
                                <span class="grades-grade-value">{{course.grade || '-'}}</span>
                            </div>

                            <ion-icon name="fas-chevron-right" class="grades-course-arrow" />
                        </div>
                    }
                </div>
            }
        </core-loading>
    </core-split-view>
</ion-content>
