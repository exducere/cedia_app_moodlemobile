<div class="course-card" (click)="openCourse()">

    <!-- Image section -->
    <div class="course-card-image" [class.has-image]="course.courseimage">
        <img *ngIf="course.courseimage" [url]="course.courseimage" core-external-content alt="" />
        <div *ngIf="!course.courseimage" class="course-card-image-placeholder"></div>

        <button class="course-fav-btn" (click)="setCourseFavourite(!course.isfavourite); $event.stopPropagation()">
            <ion-icon [name]="course.isfavourite ? 'fa-heart' : 'cedia-favourite'"></ion-icon>
        </button>
    </div>

    <!-- Info section -->
    <div class="course-card-body">
        <h3 class="course-card-title">{{ course.displayname || course.fullname }}</h3>
        <p class="course-card-shortname" *ngIf="course.shortname">{{ course.shortname }}</p>

        <div class="course-card-progress">
            <div class="course-progress-header">
                <span class="course-progress-label">Tu progreso</span>
                <span class="course-progress-value">{{ Math.round(progress < 0 ? 0 : progress) }}%</span>
            </div>
            <div class="course-progress-track" role="progressbar"
                [attr.aria-valuemin]="0" [attr.aria-valuemax]="100"
                [attr.aria-valuenow]="Math.round(progress < 0 ? 0 : progress)">
                <div class="course-progress-fill" [style.width.%]="progress < 0 ? 0 : progress"></div>
            </div>
        </div>
    </div>

</div>
