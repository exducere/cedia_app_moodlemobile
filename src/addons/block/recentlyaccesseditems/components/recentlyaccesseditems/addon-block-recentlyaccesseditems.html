<div class="recently-accessed-section">
    <div class="recently-accessed-header">
        <h2 class="recently-accessed-title">{{ 'addon.block_recentlyaccesseditems.pluginname' | translate }}</h2>
    </div>

    <core-loading [hideUntil]="loaded" placeholderType="row" placeholderWidth="110px" placeholderHeight="140px" [placeholderLimit]="4">
        @if (items && items.length > 0) {
            <div class="recently-accessed-scroll">
                @for (item of items; track item.cmid) {
                    <button class="recently-accessed-item" (click)="action($event, item)">
                        <div class="recently-accessed-icon-wrapper">
                            @if (item.iconUrl) {
                                <core-mod-icon [modicon]="item.iconUrl" [modname]="item.modname" [componentId]="item.cmid"
                                    [showAlt]="false" [purpose]="item.purpose" [isBranded]="item.branded"
                                    [colorize]="false" />
                            }
                        </div>
                        <span class="recently-accessed-name">
                            <core-format-text [text]="item.name" contextLevel="module" [contextInstanceId]="item.cmid"
                                [courseId]="item.courseid" />
                        </span>
                    </button>
                }
            </div>
        }

        @if (items.length <= 0) {
            <core-empty-box image="assets/img/icons/activities.svg"
                [message]="'addon.block_recentlyaccesseditems.noitems' | translate" />
        }
    </core-loading>
</div>
